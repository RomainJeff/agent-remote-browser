# On a v* tag: both images for amd64 and arm64, Trivy gate (CRITICAL with a fix = no release), pushed to GHCR with
# an SBOM and provenance attestation. Compose runs them with ARB_IMAGE_REPO=ghcr.io/<owner>/agent-remote-browser
# and ARB_IMAGE_TAG=<tag> (deploy/runbook.md, Upgrade). Only GITHUB_TOKEN: no repository secret.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: gateway, file: Dockerfile.gateway }
          - { name: computer, file: Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Image name (GHCR wants lowercase)
        id: ref
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agent-remote-browser-${{ matrix.name }}"
          echo "tags=$repo:$GITHUB_REF_NAME,$repo:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ponytail: the gate scans the amd64 build only (same Dockerfile, same Debian packages on arm64).
      - name: Build amd64 for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          tags: scan:${{ matrix.name }}
      - run: .github/trivy.sh scan:${{ matrix.name }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build amd64 + arm64 and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ref.outputs.tags }}
          # Links the package to this repository, so GITHUB_TOKEN can push to it again.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
