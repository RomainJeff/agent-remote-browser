# Agent Remote Browser stack (dev). Every resource name starts with ARB_PREFIX (default "arb"),
# so it can run next to another stack on the same Docker daemon.
#   docker compose up -d --build                    # gateway on http://127.0.0.1:18787/mcp, admin on :18788
#   docker compose --profile tunnel up -d --build   # + public https URL (see `docker compose logs tunnel`)
name: ${ARB_PREFIX:-arb}
services:
  # Builds the per-agent "computer" image, then exits. The gateway starts one container per agent from it.
  computer-image:
    build: .
    image: ${ARB_PREFIX:-arb}-computer:dev
    entrypoint: ["true"]
    restart: "no"

  gateway:
    build: { context: ., dockerfile: Dockerfile.gateway }
    init: true
    restart: unless-stopped
    depends_on:
      computer-image: { condition: service_completed_successfully }
    # Same port inside and outside: the admin checks Host against its own port. 18788 = admin UI,
    # localhost only, never put it behind the tunnel.
    ports: ["127.0.0.1:18787:18787", "127.0.0.1:18788:18788"]
    # The Engine API socket is root:<docker group> 0660; the gateway runs as `node`. Docker Desktop: 0. Linux: getent group docker.
    group_add: ["${DOCKER_GID:-0}"]
    environment:
      ARB_PREFIX: ${ARB_PREFIX:-arb}
      BIND_ADDR: 0.0.0.0               # inside the container; published on 127.0.0.1 only
      PORT: 18787
      ADMIN_PORT: 18788
      STATE_FILE: /data/state.json     # profiles, token hashes, saved logins, OAuth clients (0600)
      PUBLIC_URL: ${PUBLIC_URL:-}      # OAuth issuer. Empty = derived from the request Host (quick tunnel)
      AUDIT_FILE: /data/audit.jsonl
      KILL_FILE: /data/KILL            # `touch data/KILL` = every tool call refused
      IDLE_MIN: ${IDLE_MIN:-5}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}  # runsc (gVisor) on Linux; required unless ALLOW_NO_SANDBOX=1
      ALLOW_NO_SANDBOX: ${ALLOW_NO_SANDBOX:-}  # 1 = Docker default runtime (macOS dev). Empty = refuse to start without runsc
    volumes:
      # ponytail: socket access = root on the host. Upgrade: privileged runner (plan, lot 5).
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data                   # must be writable by uid 1000 (node) on Linux
      - keys:/run/arb-keys
      - egress:/run/arb-egress

  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2025.11.1
    command: tunnel --no-autoupdate --url http://gateway:18787
    restart: unless-stopped
    depends_on: [gateway]

volumes:
  keys:
    name: ${ARB_PREFIX:-arb}-keys
  egress:
    # Fixed name: the gateway mounts it into each computer by this name.
    name: ${ARB_PREFIX:-arb}-egress
