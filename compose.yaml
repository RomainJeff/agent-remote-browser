# Agent Remote Browser stack (dev). Every resource name starts with ARB_PREFIX (default "arb"),
# so it can run next to another stack on the same Docker daemon.
#   mkdir -m 700 secrets && head -c 32 /dev/urandom > secrets/login_key            # once
#   openssl rand -base64 48 | tr -d '\n' > secrets/better_auth_secret && chmod 600 secrets/*   # once
#   docker compose up -d --build                    # gateway on http://127.0.0.1:18787/mcp, admin on :18788
#   docker compose exec gateway node src/cli.ts admin create you@example.com   # once: password, TOTP
#   docker compose --profile tunnel up -d --build   # + quick tunnel; set PUBLIC_URL to its URL, then `up -d gateway`
name: ${ARB_PREFIX:-arb}
services:
  # Builds the per-agent "computer" image, then exits. The gateway starts one container per agent from it.
  computer-image:
    build: .
    image: ${ARB_PREFIX:-arb}-computer:dev
    entrypoint: ["true"]
    restart: "no"

  gateway:
    build: { context: ., dockerfile: Dockerfile.gateway }
    init: true
    restart: unless-stopped
    depends_on:
      computer-image: { condition: service_completed_successfully }
    # Same port inside and outside: the admin checks Host against its own port. 18788 = admin UI,
    # localhost only, never put it behind the tunnel.
    ports: ["127.0.0.1:18787:18787", "127.0.0.1:18788:18788"]
    # The Engine API socket is root:<docker group> 0660; the gateway runs as `node`. Docker Desktop: 0. Linux: getent group docker.
    group_add: ["${DOCKER_GID:-0}"]
    environment:
      ARB_PREFIX: ${ARB_PREFIX:-arb}
      BIND_ADDR: 0.0.0.0               # inside the container; published on 127.0.0.1 only
      PORT: 18787
      ADMIN_PORT: 18788
      DATA_DIR: /data                  # arb.db: profiles, encrypted logins, leases, Better Auth (admin, OAuth, API keys) (0600)
      LOGIN_KEY_FILE: /run/secrets/login_key
      # Better Auth baseURL (BETTER_AUTH_URL), MCP resource and OAuth issuer (${PUBLIC_URL}/api/auth).
      # Empty = http://localhost:18787 (local dev only).
      PUBLIC_URL: ${PUBLIC_URL:-}
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      ADMIN_PUBLIC: ${ADMIN_PUBLIC:-}  # 1 = admin UI also on the public listener. Default: :18788, localhost only
      ACCESS_AUD: ${ACCESS_AUD:-}      # Cloudflare Access in front of the public admin (both or neither)
      ACCESS_TEAM: ${ACCESS_TEAM:-}
      AUDIT_FILE: /data/audit.jsonl
      KILL_FILE: /data/KILL            # `docker compose exec gateway touch /data/KILL` = every tool call refused
      IDLE_MIN: ${IDLE_MIN:-5}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}  # runsc (gVisor) on Linux; required unless ALLOW_NO_SANDBOX=1
      ALLOW_NO_SANDBOX: ${ALLOW_NO_SANDBOX:-}  # 1 = Docker default runtime (macOS dev). Empty = refuse to start without runsc
    # Login key: kept out of the data volume, so a backup of arb.db alone exposes no password.
    # Better Auth secret: signs session cookies, encrypts TOTP secrets.
    secrets: [login_key, better_auth_secret]
    volumes:
      # ponytail: socket access = root on the host. Upgrade: privileged runner (plan, lot 5).
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
      - egress:/run/arb-egress

  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2025.11.1
    command: tunnel --no-autoupdate --url http://gateway:18787
    restart: unless-stopped
    depends_on: [gateway]

secrets:
  login_key:
    file: ./secrets/login_key          # 32 random bytes; readable by uid 1000 (node) on Linux
  better_auth_secret:
    file: ./secrets/better_auth_secret # 32+ characters

volumes:
  data:
    name: ${ARB_PREFIX:-arb}-data
  egress:
    # Fixed name: the gateway mounts it into each computer by this name.
    name: ${ARB_PREFIX:-arb}-egress
