# Agent Computer stack.
#   docker compose up -d --build                    # gateway on http://127.0.0.1:8787/mcp
#   docker compose --profile tunnel up -d --build   # + public https URL for Notion (see `docker compose logs tunnel`)
services:
  # Builds the per-agent "computer" image, then exits. The gateway starts one container per agent from it.
  computer-image:
    build: .
    image: agent-computer:dev
    entrypoint: ["true"]
    restart: "no"

  gateway:
    build: { context: ., dockerfile: Dockerfile.gateway }
    init: true
    restart: unless-stopped
    depends_on:
      computer-image: { condition: service_completed_successfully }
    # 8788 = admin UI. Localhost only, never put it behind the tunnel.
    ports: ["127.0.0.1:8787:8787", "127.0.0.1:8788:8788"]
    environment:
      STATE_FILE: /data/state.json     # profiles, token hashes, saved logins, OAuth clients (0600)
      PUBLIC_URL: ${PUBLIC_URL:-}      # OAuth issuer. Empty = derived from the request Host (quick tunnel)
      AUDIT_FILE: /data/audit.jsonl
      KILL_FILE: /data/KILL            # `touch data/KILL` = every tool call refused
      IDLE_MIN: ${IDLE_MIN:-5}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
    volumes:
      # ponytail: socket access = root on the host. Upgrade: docker-socket-proxy limited to containers/exec/volumes.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ac-keys:/run/ac-keys
      - ac-egress:/run/ac-egress

  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2025.11.1
    command: tunnel --no-autoupdate --url http://gateway:8787
    restart: unless-stopped
    depends_on: [gateway]

volumes:
  ac-keys:
  ac-egress:
    name: agent-computer-egress
